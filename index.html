<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KromaGit</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/kg-splash.css" />
    <script>
      try {
        const bg = localStorage.getItem('kromagit.splash.bg')
        if (bg) document.documentElement.style.setProperty('--kg-splash-bg', bg)
        if (localStorage.getItem('kromagit.splash.kind') === 'light') document.documentElement.classList.replace('dark', 'light')
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="kg-splash" role="status" aria-label="Loading KromaGit">
      <div class="kg-splash-box">
      <svg class="kg-splash-k" viewBox="250 150 550 724" aria-hidden="true">
        <defs>
          <linearGradient id="kg-splash-grad" gradientUnits="userSpaceOnUse" x1="300" y1="220" x2="740" y2="820"><stop offset="0" stop-color="#7c9cff" /><stop offset=".5" stop-color="#b47cff" /><stop offset="1" stop-color="#f472b6" /></linearGradient>
          <mask id="kg-splash-holes" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024"><rect width="1024" height="1024" fill="#fff" /><circle cx="360" cy="260" r="42" /><circle cx="690" cy="300" r="42" /><circle cx="690" cy="764" r="42" /><circle cx="360" cy="764" r="42" /></mask>
        </defs>
        <g mask="url(#kg-splash-holes)">
          <g fill="none" stroke="url(#kg-splash-grad)" stroke-width="84" stroke-linecap="round" stroke-linejoin="round">
            <path class="kg-l kg-l1" pathLength="1" d="M360 260V764" />
            <path class="kg-l kg-l2" pathLength="1" d="M360 590C360 470 470 430 560 384L690 310" />
            <path class="kg-l kg-l3" pathLength="1" d="M478 482L630 616C672 652 690 700 690 764" />
          </g>
          <g fill="url(#kg-splash-grad)">
            <circle class="kg-n kg-n1" cx="360" cy="260" r="80" />
            <circle class="kg-n kg-n2" cx="360" cy="764" r="80" />
            <circle class="kg-n kg-n3" cx="690" cy="300" r="80" />
            <circle class="kg-n kg-n4" cx="690" cy="764" r="80" />
          </g>
        </g>
      </svg>
        <div class="kg-splash-bar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
