[package]
name = "kromagit"
version = "0.1.0"
description = "Local-first AI Git desktop client"
authors = ["Chea KimHeng"]
license = "MIT"
repository = "https://github.com/cheakimhengg/KromaGit"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "KromaGit"
path = "src/main.rs"

[lib]
name = "kromagit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
regex = "1"
portable-pty = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tempfile = "3"
